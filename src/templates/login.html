<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Login</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 24px; background: #f5f7fb; color: #1f2937; }
      .card { max-width: 420px; margin: 56px auto; background: white; border-radius: 10px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
      h1 { margin-top: 0; font-size: 22px; }
      label { display: block; margin: 10px 0 6px; font-size: 13px; color: #374151; }
      input { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 8px; box-sizing: border-box; }
      button { margin-top: 12px; background: #2563eb; border: none; color: white; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
      .flash { padding: 10px 12px; border-radius: 8px; margin: 0 auto 10px; max-width: 420px; }
      .flash.success { background: #dcfce7; color: #166534; }
      .flash.error { background: #fee2e2; color: #991b1b; }
      .muted { color: #6b7280; font-size: 12px; }
      code { background: #eef2ff; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <div class="card">
      <h1>Crawler Admin 登录</h1>
      <p class="muted">默认账号名: <code>{{ auth_username }}</code></p>
      <form method="post" action="/login">
        <input type="hidden" name="next" value="{{ next_path or '' }}" />
        <label>用户名</label>
        <input name="username" required />
        <label>密码</label>
        <input name="password" type="password" required />
        <button type="submit">登录</button>
      </form>
    </div>
  </body>
</html>
